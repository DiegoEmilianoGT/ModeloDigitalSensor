global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

rule_files:
  - "alertas_bme280.yml"
  - "calibracion_sensor.yml"

scrape_configs:
  - job_name: "bme280"
    metrics_path: /metrics
    file_sd_configs:
      - files: ["targets/bme280.json"]
        refresh_interval: 30s

  - job_name: "dht22"
    metrics_path: /metrics
    file_sd_configs:
      - files: ["targets/dht22.json"]
        refresh_interval: 30s
