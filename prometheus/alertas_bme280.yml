groups:
  - name: nodos
    rules:
      #  nodo no responde
      - alert: NodoCaido
        expr: up{job=~"bme280|dht22"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          resumen: "El nodo {{ $labels.nodo }} ({{ $labels.instance }}) no responde"

      # el nodo responde pero el sensor no entrega lecturas
      - alert: SensorSinLectura
        expr: |-
          label_replace(bme280_sensor_up, "sensor", "bme280", "", "") == 0
          or label_replace(dht22_sensor_up, "sensor", "dht22", "", "") == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          resumen: "El sensor no entrega lecturas validas"

      # umbrales sobre los valores calibrados 
      - alert: TemperaturaAlta
        expr: |-
          label_replace(bme280_temperatura_celsius_calibrada, "sensor", "bme280", "", "") > 30
          or label_replace(dht22_temperatura_celsius_calibrada, "sensor", "dht22", "", "") > 30
        for: 1m
        keep_firing_for: 2m
        labels:
          severity: warning
        annotations:
          resumen: '{{ $value | printf "%.1f" }} °C (maximo 30 °C)'

      - alert: TemperaturaBaja
        expr: |-
          label_replace(bme280_temperatura_celsius_calibrada, "sensor", "bme280", "", "") < 10
          or label_replace(dht22_temperatura_celsius_calibrada, "sensor", "dht22", "", "") < 10
        for: 1m
        keep_firing_for: 2m
        labels:
          severity: warning
        annotations:
          resumen: '{{ $value | printf "%.1f" }} °C (minimo 10 °C)'

      - alert: HumedadAlta
        expr: |-
          label_replace(bme280_humedad_porcentaje_calibrada, "sensor", "bme280", "", "") > 65
          or label_replace(dht22_humedad_porcentaje_calibrada, "sensor", "dht22", "", "") > 65
        for: 1m
        keep_firing_for: 2m
        labels:
          severity: warning
        annotations:
          resumen: '{{ $value | printf "%.1f" }} % (maximo 65 %)'

      - alert: HumedadBaja
        expr: |-
          label_replace(bme280_humedad_porcentaje_calibrada, "sensor", "bme280", "", "") < 15
          or label_replace(dht22_humedad_porcentaje_calibrada, "sensor", "dht22", "", "") < 15
        for: 1m
        keep_firing_for: 2m
        labels:
          severity: warning
        annotations:
          resumen: '{{ $value | printf "%.1f" }} % (minimo 15 %)'

      - alert: PresionFueraDeRango
        expr: bme280_presion_hpa > 1050 or bme280_presion_hpa < 700
        for: 1m
        keep_firing_for: 2m
        labels:
          severity: warning
        annotations:
          resumen: '{{ $value | printf "%.0f" }} hPa (rango 700 a 1050 hPa)'
